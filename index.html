<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown to HTML Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <header class="masthead">
      <h1>Markdown <span class="arrow" aria-hidden="true">&rarr;</span> HTML</h1>
      <p class="tagline">Type on the left. Watch it get typeset on the right.</p>
    </header>

    <main class="proof">

      <section class="pane pane-input">
        <div class="pane-head">
          <span class="stage">1</span>
          <label for="markdown-input">Markdown source</label>
        </div>
        <textarea id="markdown-input" placeholder="Type markdown here..." spellcheck="false"></textarea>
      </section>

      <div class="pane-stack">

        <section class="pane pane-output">
          <div class="pane-head">
            <span class="stage">2</span>
            <label for="html-output">HTML output</label>
          </div>
          <pre id="html-output"></pre>
        </section>

        <section class="pane pane-preview">
          <div class="pane-head">
            <span class="stage">3</span>
            <h2>Preview</h2>
          </div>
          <div id="preview"></div>
        </section>

      </div>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
